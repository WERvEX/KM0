name: CI

on:
  push:
  pull_request:
  # Run by hand with a version such as v0.1.0 to tag the chosen commit and publish a release.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium and Electron system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: xvfb-run -a pnpm e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore

  web:
    name: Deploy web debug build
    needs: check
    # The latest push to master or a working branch is what the Pages site shows.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/desktop/out/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy web debug build from ${{ github.sha }}"

  package:
    name: Package (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Builds are unsigned for now.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: KM0-${{ runner.os }}
          path: |
            apps/desktop/release/*/KM0-*.exe
            apps/desktop/release/*/KM0-*.dmg
            apps/desktop/release/*/KM0-*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    # A pushed v* tag, or a manual run with a tag, publishes the installers built above as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: KM0-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: KM0 ${{ inputs.tag || github.ref_name }}
          body_path: docs/releases/${{ inputs.tag || github.ref_name }}.md
          files: dist/**/KM0-*
          fail_on_unmatched_files: true
