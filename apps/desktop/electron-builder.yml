appId: io.github.wervex.km0
productName: KM0
executableName: KM0
copyright: Copyright © 2026 WERvEX
directories:
  output: release/${version}
  buildResources: build
# Everything the app needs is bundled into out/ by electron-vite; no node_modules ship.
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: KM0-${version}-setup-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: KM0-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  executableName: km0
  artifactName: KM0-${version}-${arch}.${ext}
publish: null
